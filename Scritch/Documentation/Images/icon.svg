<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Accent Stroke Gradient -->
    <linearGradient id="scritchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip Path for Squircle -->
    <clipPath id="squircle">
      <rect x="32" y="32" width="448" height="448" rx="100" ry="100" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Base Background -->
    <rect x="32" y="32" width="448" height="448" fill="url(#bgGrad)" />

    <!-- Grid / Terminal Background Lines -->
    <path d="M32 96h448M32 160h448M32 224h448M32 288h448M32 352h448M32 416h448" 
          stroke="#30363d" stroke-width="1" opacity="0.4" />

    <!-- Code Brackets & Syntax Elements -->
    <g stroke="#484f58" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
      <!-- < > code icon -->
      <path d="M120 160l-32 32 32 32" />
      <path d="M176 160l32 32-32 32" />
      <!-- Subtle code line -->
      <line x1="236" y1="192" x2="310" y2="192" stroke="#30363d" stroke-width="10" />
    </g>

    <!-- The 'Scritch' Scratchpad Stroke -->
    <path d="M120 340 c 40 -80, 80 -120, 140 -80 c 60 40, 110 -60, 60 -110 c -40 -40, -100 20, -40 80 c 60 60, 120 10, 140 -20" 
          fill="none" 
          stroke="url(#scritchGrad)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- Subtle Border Overlay -->
    <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.1" />
  </g>
</svg>
